name: inventory-connector
group_id: inventory-customers-group
topic: dbserver1.inventory.customers
writer:
  clickhouse:
    database: inventory
    table: customers
    schema:
      origin:
        - name: id
          type: Int32
          isnull: false
        - name: first_name
          type: String
          isnull: false
        - name: last_name
          type: String
          isnull: false
        - name: email
          type: String
          isnull: false
      final:
        - name: id
          type: Int32
          isnull: false
        - name: full_name
          type: String
          isnull: false
        - name: email
          type: String
          isnull: false
    primary_key: id
    transforms:
      full_name: CONCAT(last_name, ', ', first_name) AS full_name
